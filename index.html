*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}

h1{font-size:1.7rem;line-height:1.3;margin:.2em 0 .4em;letter-spacing:-.02em}

.qnum{color:var(--accent);font-weight:800;font-size:.95rem}

.opt:hover,.opt:focus-visible{border-color:var(--accent);outline:none}
.back{background:none;border:0;color:var(--sub);font-size:.9rem;cursor:pointer;padding:8px 0;font-family:inherit}
.center{text-align:center}
.tag{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;border-radius:99px;padding:4px 12px;font-size:.85rem}
ul{padding-left:1.2em;margin:.3em 0}
li{margin:.25em 0}
.box{border-radius:14px;padding:14px 16px;margin-top:10px}
.box.good{background:var(--soft)}
.box.warn{background:var(--warn-soft)}
.box.warn h3{color:var(--warn)}
.box h3{margin:0 0 .3em;font-size:1rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.match a{display:block;background:var(--soft);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);text-align:center}
.match small{display:block;color:var(--sub);font-size:.8rem}
.match b{display:block;margin-top:4px}
.ad-slot{margin:22px 0;min-height:0}
.ad-slot:empty{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;font-size:.85rem;color:var(--sub);margin-top:28px}
footer a{color:var(--sub)}
.all{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.all a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-size:.9rem;text-align:center}
[hidden]{display:none!important}
</style>

    tips:['딱 하나, 자동이체 적금만 걸어두세요. 의지 대신 시스템이 모아줍니다','투자는 잃어도 괜찮은 금액만, 소문 말고 직접 확인한 곳에','큰 지출 전엔 하루만 기다리는 "24시간 룰"을 써보세요']},

    desc:'예쁜 것, 새로운 것, 할인하는 것을 보면 그냥 지나치기 어렵습니다. 하지만 투자는 무서워서 돈은 통장에 두는 편. 쇼핑으로 스트레스를 푸는 따뜻하고 감각 좋은 타입입니다.',
    good:['트렌드와 좋은 물건을 알아보는 감각','위험한 투자에 휩쓸리지 않는다','선물 고르기 장인'],
    warn:['할인·특가 알림이 지출의 주범일 수 있어요','쌓인 물건 대비 통장 잔고가 아쉬울 수 있어요'],
    tips:['쇼핑 앱 알림을 끄고, 장바구니에 담은 뒤 3일 후에 결제해 보세요','안 쓰는 물건을 중고로 파는 것도 훌륭한 재테크예요','"물건 1개 사면 1개 비우기" 규칙으로 소비를 점검해 보세요']},
  IOR:{emoji:'🎲', name:'한방 승부사', tagline:'크게 벌고 크게 쓴다',
    desc:'갖고 싶은 건 사야 하고, 돈은 크게 불려야 한다고 생각합니다. 과감함과 승부욕이 무기. 잘 풀릴 때는 누구보다 화끈하지만, 그만큼 변동도 큰 스릴 넘치는 재무 인생을 살고 있을지도요.',
    good:['결단력이 빠르고 배짱이 있다','수익 기회에 민감하다','목표가 크고 추진력이 강하다'],
    warn:['레버리지·몰빵 투자는 한 번에 큰 손실로 이어질 수 있어요','기분에 따른 소비와 투자가 겹치면 위험해요'],
    tips:['투자금의 상한선을 정하고 생활비 통장과 확실히 분리하세요','한 종목 비중이 전체의 20%를 넘지 않게 해보세요','수익이 나면 일부를 안전 자산으로 옮기는 습관을 들이세요']},
};
const ORDER = ['PES','PER','POS','POR','IES','IER','IOS','IOR'];

const $ = id => document.getElementById(id);
let idx = 0, answers = [];

function show(id){ for(const s of ['start','quiz','result']) $(s).hidden = s!==id; window.scrollTo(0,0); }

function renderQ(){
  const q = QUESTIONS[idx];
  $('bar').style.width = (idx/QUESTIONS.length*100)+'%';
  $('qnum').textContent = `Q${idx+1} / ${QUESTIONS.length}`;
  $('qtext').textContent = q.q;
  $('opts').innerHTML = '';
  for(const k of ['a','b']){
    const b = document.createElement('button');
    b.className='opt'; b.textContent=q[k];
    b.onclick=()=>pick(k);
    $('opts').appendChild(b);
  }
  $('backBtn').hidden = idx===0;
}

function pick(k){
  answers[idx]=k; idx++;
  if(idx<QUESTIONS.length) renderQ();
  else finish();
}

function computeCode(){
  return AXES.map((pair,ax)=>{
    const qs = QUESTIONS.map((q,i)=>[q,i]).filter(([q])=>q.axis===ax);
    const aCount = qs.filter(([,i])=>answers[i]==='a').length;
    if(aCount*2===qs.length) return answers[qs[0][1]]==='a'?pair[0]:pair[1]; // 동점이면 첫 질문으로
    return aCount*2>qs.length?pair[0]:pair[1];
  }).join('');
}

function flip(code,positions){
  return code.split('').map((c,i)=>positions.includes(i)?AXES[i].find(x=>x!==c):c).join('');
}

function finish(){
  const code = computeCode();
  history.replaceState(null,'','?r='+code);
  renderResult(code,true);
}

function fillMatch(el,code){
  const t=TYPES[code];
  el.querySelector('span').textContent=t.emoji;
  el.querySelector('b').textContent=t.name;
  el.href='?r='+code;
}

function renderResult(code,mine){
  const t = TYPES[code];
  $('rLabel').textContent = mine?'나의 돈 쓰는 유형은':'돈 쓰는 유형';
  $('rEmoji').textContent=t.emoji; $('rName').textContent=t.name; $('rTagline').textContent=t.tagline;
  $('rDesc').textContent=t.desc;
  const list=(id,arr)=>{$(id).innerHTML='';arr.forEach(x=>{const li=document.createElement('li');li.textContent=x;$(id).appendChild(li);});};
  list('rGood',t.good); list('rWarn',t.warn); list('rTips',t.tips);
  fillMatch($('mBest'),flip(code,[0]));
  fillMatch($('mWorst'),flip(code,[0,1,2]));
  $('retryBtn').textContent = mine?'테스트 다시 하기':'나도 테스트 해보기';
  document.title = `${t.emoji} ${t.name} | 나의 돈 쓰는 유형 테스트`;
  show('result');
}

function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800); }

async function share(){
  const code = new URLSearchParams(location.search).get('r');
  const t = TYPES[code];
  const url = location.origin+location.pathname+'?r='+code;
  const text = `나의 돈 쓰는 유형은 ${t.emoji} ${t.name}! 너는 어떤 유형이야?`;
  if(navigator.share){ try{ await navigator.share({title:'나의 돈 쓰는 유형 테스트',text,url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text+' '+url); toast('링크를 복사했어요'); }
  catch{ prompt('아래 링크를 복사하세요', url); }
}

function start(){ idx=0; answers=[]; history.replaceState(null,'',location.pathname); renderQ(); show('quiz'); }

$('startBtn').onclick=start;
$('retryBtn').onclick=start;
$('backBtn').onclick=()=>{ if(idx>0){ idx--; renderQ(); } };
$('shareBtn').onclick=share;

const all=$('allTypes');
ORDER.forEach(c=>{const a=document.createElement('a');a.href='?r='+c;a.textContent=TYPES[c].emoji+' '+TYPES[c].name;all.appendChild(a);});

const initial = new URLSearchParams(location.search).get('r');
if(initial && TYPES[initial]) renderResult(initial,false);
</script>
</body>
